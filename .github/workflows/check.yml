name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # rig needs a token to fetch hypogeom from GitHub without rate limits.
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      # The runner context is not available in job-level env, so set it here.
      - name: Set rig cache directory
        shell: bash
        run: echo "RIG_CACHE_DIR=$RUNNER_TEMP/rig-cache" >> "$GITHUB_ENV"

      # rig is installed in user mode (no admin rights), as collaborators do.
      - name: Install rig (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -LsSf https://r-lib.github.io/rig/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install rig (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://r-lib.github.io/rig/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Check rig version
        run: rig --version

      - name: Switch rig to user mode
        run: rig system user-mode

      # Downloaded packages and binaries, keyed on the lock file.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rig-cache
          key: rig-${{ runner.os }}-${{ hashFiles('rproj.lock') }}

      # R and packages come from rproj.lock; fail if the lock is stale.
      - name: Check lock file is current
        run: rig proj lock --check

      - name: Install R and packages
        run: rig proj sync --locked

      # Pinned so a new air release cannot change formatting and fail CI;
      # keep in step with the version developers run locally (`air --version`).
      - uses: posit-dev/setup-air@v1
        if: runner.os == 'Linux'
        with:
          version: "0.13.0"

      - name: Check formatting
        if: runner.os == 'Linux'
        run: air format --check .

      - name: Lint ratchet
        shell: bash
        run: rig run tools/lint_ratchet.R

      - name: Undefined names
        shell: bash
        run: rig run tools/check_globals.R

      - name: Tests
        shell: bash
        run: rig run tests/testthat.R
